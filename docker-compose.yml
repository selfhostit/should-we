# Paste this into Synology Container Manager > Project > Create, or run
# `docker compose up -d` next to it on any home server.
# Data lives in ./pb_data next to this file (/volume1/docker/should-we/pb_data on a Synology).
# The port and time zone can also be set in a .env file next to this one:
# SHOULD_WE_PORT=8091 and TZ=Europe/Brussels.
services:
  should-we:
    image: ghcr.io/selfhostit/should-we:2
    container_name: should-we
    restart: always
    ports:
      - "127.0.0.1:${SHOULD_WE_PORT:-8091}:8090" # only reachable through your reverse proxy
    volumes:
      - ./pb_data:/app/pb_data
    environment:
      - TZ=${TZ:-Europe/Brussels}
      - PUID=${PUID:-1000} # the user (and group) should-we runs as, who owns ./pb_data
      - PGID=${PGID:-1000}
    # should-we starts as root only to give ./pb_data to PUID:PGID, then runs as that user;
    # switching drops these capabilities again. It can't gain new privileges, and nothing
    # in the container can be changed apart from the data folder and /tmp.
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
